services:
  mongodb:
    image: mongo:7
    container_name: twk-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=thewovencloudkitchen
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twk-admin-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017
      - DB_NAME=thewovencloudkitchen
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - JWT_EXPIRES_IN=7d
      - API_PREFIX=/api/v1
      - LOG_LEVEL=info

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twk-admin-seed
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017
      - DB_NAME=thewovencloudkitchen
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@thewovencloudkitchen.com}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-System Administrator}
    command: ["node", "dist/infrastructure/database/seed/index.js"]

volumes:
  mongo_data:
    driver: local
